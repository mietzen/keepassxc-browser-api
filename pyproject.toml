[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keepassxc-browser-api"
version = "1.5.0+windows.1"
description = "Python library for the KeePassXC browser extension protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyNaCl==1.6.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools]
packages = ["keepassxc_browser_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["**/__init__.py"]

[tool.ruff.lint]
ignore = ["E501"]
