[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "keepassxc-browser-api"
dynamic = ["version"]
description = "Python library for the KeePassXC browser extension protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "PyNaCl==1.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["keepassxc_browser_api"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
